services:
  postgres:
    image: postgres:16
    container_name: strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliocms
      POSTGRES_USER: portfoliocms
      POSTGRES_PASSWORD: portfoliocms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: